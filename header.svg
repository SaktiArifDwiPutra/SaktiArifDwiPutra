<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ultra High Contrast Background -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#0a0510" />
      <stop offset="100%" stop-color="#020810" />
    </linearGradient>

    <!-- Neon Gradients for Text and Borders -->
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="neonYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
      <animate attributeName="x1" values="0%;100%;0%" dur="5s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Glassmorphism & Glow Filters -->
    <filter id="glowPink">
      <feGaussianBlur stdDeviation="8" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowCyan">
      <feGaussianBlur stdDeviation="6" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="heavyBlur">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <style>
      /* Dynamic Animations for a "Rame" Feel */
      @keyframes floatWindow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-6px) rotate(0.5deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-15px) scale(1.05); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(-5deg); }
        50% { transform: translateY(10px) rotate(5deg); }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 0.3; }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes meteor {
        0% { transform: translate(100px, -100px); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translate(-300px, 300px); opacity: 0; }
      }

      .mac-window { animation: floatWindow 6s ease-in-out infinite; transform-origin: center; }
      .fly-item-1 { animation: floatFast 4s ease-in-out infinite; transform-origin: center; }
      .fly-item-2 { animation: floatSlow 7s ease-in-out infinite; transform-origin: center; }
      .spinner { animation: spin 15s linear infinite; transform-origin: center; }
      .cursor { animation: blink 1s infinite; }
      .pulsar { animation: pulse 3s infinite; }
      .shooting-star { animation: meteor 4s linear infinite; }
      .shooting-star-delay { animation: meteor 6s linear infinite 2s; }

      /* Typography */
      .cmd-text { font-family: 'Courier New', monospace; font-size: 13px; fill: #a1a1aa; }
      .cmd-highlight { fill: #00f2fe; font-weight: bold; }
      .hero-name { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 38px; font-weight: 900; fill: url(#neonYellow); letter-spacing: -1px; }
      .hero-role { font-family: 'Courier New', monospace; font-size: 16px; font-weight: bold; fill: #ff007a; }
      .cmd-comment { font-family: 'Courier New', monospace; font-size: 13px; fill: #71717a; font-style: italic; }
      .bg-text { font-family: 'Arial Black', sans-serif; font-size: 180px; font-weight: 900; fill: #ffffff; opacity: 0.02; }
    </style>
  </defs>

  <!-- Deep High Contrast Background -->
  <rect width="900" height="320" fill="url(#bgDark)" />
  
  <!-- Massive Background Typography (Subtle but adds detail) -->
  <text class="bg-text" x="-20" y="240">CREATOR</text>

  <!-- Glowing Abstract Background Orbs -->
  <circle cx="150" cy="80" r="100" fill="#ff007a" opacity="0.25" filter="url(#heavyBlur)" />
  <circle cx="750" cy="240" r="120" fill="#00f2fe" opacity="0.2" filter="url(#heavyBlur)" />
  <circle cx="500" cy="160" r="150" fill="#7928ca" opacity="0.15" filter="url(#heavyBlur)" />

  <!-- Dynamic Stars / Meteors crossing behind -->
  <line class="shooting-star" x1="600" y1="0" x2="550" y2="50" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />
  <line class="shooting-star-delay" x1="850" y1="50" x2="800" y2="100" stroke="#ff007a" stroke-width="2" stroke-linecap="round" />

  <!-- Floating Background Particles (Pluses and Circles) -->
  <g class="pulsar">
    <path d="M 80,240 h10 m-5,-5 v10" stroke="#ff007a" stroke-width="2" />
    <path d="M 820,60 h10 m-5,-5 v10" stroke="#ffe259" stroke-width="2" />
    <circle cx="450" cy="40" r="2" fill="#00f2fe" />
    <circle cx="100" cy="120" r="3" fill="#ffe259" />
    <circle cx="850" cy="180" r="2" fill="#ff007a" />
  </g>

  <!-- Rotating Geometric Decals in Background -->
  <g class="spinner" transform="translate(150, 160)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#ff007a" stroke-width="1" stroke-dasharray="4 8" opacity="0.6" />
  </g>
  <g class="spinner" transform="translate(750, 120)" style="animation-direction: reverse; animation-duration: 20s;">
    <rect x="-35" y="-35" width="70" height="70" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="10 10" opacity="0.4" />
  </g>


  <!-- ================= THE MAC OS WINDOW ================= -->
  <g class="mac-window">
    <!-- Window Drop Shadow -->
    <rect x="130" y="50" width="640" height="210" rx="14" fill="#000000" opacity="0.7" filter="blur(12px)" />
    
    <!-- Window Main Body (Glassmorphism look) -->
    <rect x="130" y="45" width="640" height="210" rx="14" fill="#09090e" stroke="#27272a" stroke-width="2" />
    <!-- Subtle Gradient overlay for the window -->
    <rect x="130" y="45" width="640" height="210" rx="14" fill="url(#neonCyan)" opacity="0.03" />

    <!-- Mac OS Title Bar -->
    <path d="M 130,59 Q 130,45 144,45 L 756,45 Q 770,45 770,59 L 770,75 L 130,75 Z" fill="#121218" />
    <rect x="130" y="74" width="640" height="1" fill="#27272a" />
    
    <!-- Traffic Light Buttons -->
    <circle cx="155" cy="60" r="6" fill="#ff5f56" /> <!-- Red -->
    <circle cx="175" cy="60" r="6" fill="#ffbd2e" /> <!-- Yellow -->
    <circle cx="195" cy="60" r="6" fill="#27c93f" /> <!-- Green -->

    <!-- Window Title -->
    <text x="450" y="64" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa" text-anchor="middle">
      sakti@creator-hub: ~
    </text>

    <!-- Content Inside Terminal -->
    <!-- Line 1: Command -->
    <text class="cmd-text" x="160" y="110">> <tspan class="cmd-highlight">whoami</tspan></text>
    
    <!-- Line 2: Big Bold Name -->
    <text class="hero-name" x="160" y="148">Sakti Arif Dwi Putra</text>
    
    <!-- Line 3: Dual Roles -->
    <text class="hero-role" x="160" y="175">Fullstack Architect <tspan fill="#e4e4e7">x</tspan> Indie Game Dev</text>
    
    <!-- Line 4 & 5: Creative Description -->
    <text class="cmd-comment" x="160" y="205"># Transforming coffee & logic into digital universes.</text>
    <text class="cmd-text" x="160" y="230">> Current_Quest: <tspan fill="#ffe259">Expanding [DRAGONHOLD]</tspan></text>
    
    <!-- Blinking Cursor -->
    <rect class="cursor" x="430" y="218" width="8" height="14" fill="#00f2fe" />
  </g>


  <!-- ================= FLOATING 3D ELEMENTS (BREAKING THE FRAME) ================= -->

  <!-- Left Side: Code/Web Elements Breaking out -->
  <g class="fly-item-1" transform="translate(60, 180)">
    <!-- Giant Code Bracket -->
    <text font-family="monospace" font-size="60" font-weight="900" fill="#00f2fe" filter="url(#glowCyan)"></></text>
    <!-- Little floating JS/TS symbol -->
    <rect x="-10" y="-30" width="30" height="30" rx="6" fill="#09090e" stroke="#00f2fe" stroke-width="2" />
    <text x="5" y="-10" font-family="system-ui" font-size="14" font-weight="bold" fill="#00f2fe" text-anchor="middle">TS</text>
  </g>

  <!-- Right Side: Game Dev Controller Breaking out -->
  <g class="fly-item-2" transform="translate(740, 90)">
    <!-- Glowing Gamepad shape crossing the window border -->
    <rect x="0" y="0" width="120" height="80" rx="40" fill="#09090e" stroke="#ff007a" stroke-width="3" filter="url(#glowPink)" />
    <!-- D-Pad -->
    <path d="M 25,35 h 10 v -10 h 10 v 10 h 10 v 10 h -10 v 10 h -10 v -10 h -10 z" fill="#ff007a" />
    <!-- Action Buttons -->
    <circle cx="85" cy="25" r="5" fill="#ffe259" />
    <circle cx="100" cy="40" r="5" fill="#00f2fe" />
    <circle cx="85" cy="55" r="5" fill="#27c93f" />
    <circle cx="70" cy="40" r="5" fill="#ff007a" />
  </g>
  
  <!-- Additional Foreground Floating Accent -->
  <g class="fly-item-1" transform="translate(350, 270)">
    <polygon points="0,-15 15,10 -15,10" fill="none" stroke="#ffe259" stroke-width="3" filter="drop-shadow(0 0 4px #ffe259)" />
  </g>

</svg>