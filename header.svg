<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ultra High Contrast Background -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#0a0510" />
      <stop offset="100%" stop-color="#020810" />
    </linearGradient>

    <!-- Neon Gradients for Text and Borders -->
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="neonYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe259">
        <animate attributeName="stop-color" values="#ffe259;#ffa751;#ffe259" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ffa751">
        <animate attributeName="stop-color" values="#ffa751;#ffe259;#ffa751" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glassmorphism & Glow Filters with expanded regions to prevent clipping -->
    <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowYellow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="heavyBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="windowClip">
      <rect x="130" y="45" width="640" height="210" rx="14" />
    </clipPath>
    <filter id="windowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" />
    </filter>

    <style>
      /* Dynamic Animations */
      @keyframes floatWindow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-10px) scale(1.03); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(-4deg); }
        50% { transform: translateY(8px) rotate(4deg); }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 0.3; }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes meteor {
        0% { transform: translate(100px, -100px); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translate(-300px, 300px); opacity: 0; }
      }

      .mac-window { animation: floatWindow 6s ease-in-out infinite; }
      .fly-item-1 { animation: floatFast 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .fly-item-2 { animation: floatSlow 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .spinner { animation: spin 15s linear infinite; transform-origin: 0 0; }
      .spinner-reverse { animation: spinReverse 20s linear infinite; transform-origin: 0 0; }
      .cursor { animation: blink 1s step-end infinite; }
      .pulsar { animation: pulse 3s infinite; }
      .shooting-star { animation: meteor 4s linear infinite; }
      .shooting-star-delay { animation: meteor 6s linear infinite 2s; }

      @keyframes riseIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes sweep {
        0%, 55% { transform: translateX(-260px); }
        100% { transform: translateX(900px); }
      }
      @keyframes borderGlow {
        0%, 100% { stroke-opacity: 0.25; }
        50% { stroke-opacity: 0.9; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      @keyframes roleSlide {
        0%, 100% { stroke-dashoffset: 0; }
        50% { stroke-dashoffset: 40; }
      }

      .l1 { animation: riseIn 0.6s ease-out 0.2s both; }
      .l2 { animation: riseIn 0.7s ease-out 0.6s both; }
      .l3 { animation: riseIn 0.7s ease-out 1.0s both; }
      .l4 { animation: riseIn 0.7s ease-out 1.4s both; }
      .l5 { animation: riseIn 0.7s ease-out 1.8s both; }
      .sweep { animation: sweep 7s ease-in-out infinite; }
      .win-border { animation: borderGlow 5s ease-in-out infinite; }
      .twinkle { animation: twinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .twinkle-b { animation-delay: 1s; }
      .twinkle-c { animation-delay: 2s; }
      .underline { stroke-dasharray: 20 20; animation: roleSlide 3s ease-in-out infinite; }

      /* Typography */
      .cmd-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; fill: #a1a1aa; }
      .cmd-highlight { fill: #00f2fe; font-weight: bold; }
      .hero-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 38px; font-weight: 900; fill: url(#neonYellow); letter-spacing: -1px; }
      .hero-role { font-family: 'Consolas', 'Courier New', monospace; font-size: 16px; font-weight: bold; fill: #ff007a; }
      .cmd-comment { font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; fill: #71717a; font-style: italic; }
      .bg-text { font-family: 'Impact', 'Arial Black', sans-serif; font-size: 180px; font-weight: 900; fill: #ffffff; opacity: 0.02; }
    </style>
  </defs>

  <!-- Deep High Contrast Background with subtle rounded corners -->
  <rect width="900" height="320" rx="10" fill="url(#bgDark)" />
  
  <!-- Massive Background Typography -->
  <text class="bg-text" x="-20" y="240">CREATOR</text>

  <!-- Glowing Abstract Background Orbs -->
  <circle cx="150" cy="80" r="100" fill="#ff007a" opacity="0.25" filter="url(#heavyBlur)" />
  <circle cx="750" cy="240" r="120" fill="#00f2fe" opacity="0.2" filter="url(#heavyBlur)" />
  <circle cx="500" cy="160" r="150" fill="#7928ca" opacity="0.15" filter="url(#heavyBlur)" />

  <!-- Dynamic Stars / Meteors crossing behind -->
  <line class="shooting-star" x1="600" y1="0" x2="550" y2="50" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />
  <line class="shooting-star-delay" x1="850" y1="50" x2="800" y2="100" stroke="#ff007a" stroke-width="2" stroke-linecap="round" />

  <!-- Floating Background Particles (Pluses and Circles) -->
  <g class="pulsar">
    <path d="M 80,240 h10 m-5,-5 v10" stroke="#ff007a" stroke-width="2" />
    <path d="M 820,60 h10 m-5,-5 v10" stroke="#ffe259" stroke-width="2" />
  </g>
  <!-- Twinkling stars -->
  <circle class="twinkle" cx="450" cy="30" r="2" fill="#00f2fe" />
  <circle class="twinkle twinkle-b" cx="100" cy="120" r="3" fill="#ffe259" />
  <circle class="twinkle twinkle-c" cx="850" cy="180" r="2" fill="#ff007a" />
  <circle class="twinkle twinkle-b" cx="620" cy="295" r="2" fill="#00f2fe" />
  <circle class="twinkle" cx="40" cy="40" r="2" fill="#ffffff" />

  <!-- Rotating Geometric Decals in Background (Separated container from animation) -->
  <g transform="translate(150, 160)">
    <g class="spinner">
      <circle cx="0" cy="0" r="45" fill="none" stroke="#ff007a" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6" />
    </g>
  </g>
  <g transform="translate(750, 120)">
    <g class="spinner-reverse">
      <rect x="-35" y="-35" width="70" height="70" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.4" />
    </g>
  </g>


  <!-- ================= THE MAC OS WINDOW ================= -->
  <g class="mac-window">
    <!-- Window Drop Shadow -->
    <rect x="130" y="52" width="640" height="210" rx="14" fill="#000000" opacity="0.7" filter="url(#windowShadow)" />
    
    <!-- Window Main Body (Glassmorphism look) -->
    <rect x="130" y="45" width="640" height="210" rx="14" fill="#09090e" stroke="#27272a" stroke-width="2" />
    <!-- Subtle Gradient overlay for the window -->
    <rect x="130" y="45" width="640" height="210" rx="14" fill="url(#neonCyan)" opacity="0.03" />
    <rect class="win-border" x="130" y="45" width="640" height="210" rx="14" fill="none" stroke="#00f2fe" stroke-width="1.5" />
    <!-- Soft light sweep across the window -->
    <g clip-path="url(#windowClip)">
      <rect class="sweep" x="130" y="45" width="140" height="210" fill="url(#sweepGrad)" />
    </g>

    <!-- Mac OS Title Bar -->
    <path d="M 130,59 Q 130,45 144,45 L 756,45 Q 770,45 770,59 L 770,75 L 130,75 Z" fill="#121218" />
    <rect x="130" y="74" width="640" height="1" fill="#27272a" />
    
    <!-- Traffic Light Buttons -->
    <circle cx="155" cy="60" r="6" fill="#ff5f56" /> <!-- Red -->
    <circle cx="175" cy="60" r="6" fill="#ffbd2e" /> <!-- Yellow -->
    <circle cx="195" cy="60" r="6" fill="#27c93f" /> <!-- Green -->

    <!-- Window Title -->
    <text x="450" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa" text-anchor="middle">
      sakti@creator-hub: ~
    </text>

    <!-- Content Inside Terminal -->
    <!-- Line 1: Command -->
    <text class="cmd-text l1" x="160" y="110">&gt; <tspan class="cmd-highlight">whoami</tspan></text>
    
    <!-- Line 2: Big Bold Name -->
    <text class="hero-name l2" x="160" y="148">Sakti Arif Dwi Putra</text>
    
    <!-- Line 3: Dual Roles -->
    <text class="hero-role l3" x="160" y="175">Fullstack Architect <tspan fill="#e4e4e7">x</tspan> Indie Game Dev</text>
    <line class="underline l3" x1="160" y1="183" x2="420" y2="183" stroke="#ff007a" stroke-width="1.5" stroke-opacity="0.6" />
    
    <!-- Line 4 & 5: Creative Description -->
    <text class="cmd-comment l4" x="160" y="205"># Transforming coffee &amp; logic into digital universes.</text>
    <text class="cmd-text l5" x="160" y="230">&gt; Focus: <tspan fill="#ffe259">Clean code, scalable systems, playful games</tspan><tspan class="cursor" fill="#00f2fe"> ▋</tspan></text>
  </g>


  <!-- ================= FLOATING 3D ELEMENTS (BREAKING THE FRAME) ================= -->

  <!-- Left Side: Code/Web Elements Breaking out -->
  <g transform="translate(60, 180)">
    <g class="fly-item-1">
      <!-- Giant Code Bracket -->
      <text x="0" y="15" font-family="'Consolas', 'Courier New', monospace" font-size="54" font-weight="900" fill="#00f2fe" filter="url(#glowCyan)">&lt;/&gt;</text>
      <!-- Little floating TS symbol (positioned above the bracket so it doesn't overlap) -->
      <g transform="translate(-10, -50)">
        <rect x="0" y="0" width="32" height="32" rx="7" fill="#09090e" stroke="#00f2fe" stroke-width="2" filter="url(#glowCyan)" />
        <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#00f2fe" text-anchor="middle">^_^</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Game Dev Controller Breaking out -->
  <g transform="translate(740, 85)">
    <g class="fly-item-2">
      <!-- Glowing Gamepad shape crossing the window border -->
      <rect x="0" y="0" width="120" height="80" rx="40" fill="#09090e" stroke="#ff007a" stroke-width="3" filter="url(#glowPink)" />
      <!-- D-Pad -->
      <path d="M 25,35 h 10 v -10 h 10 v 10 h 10 v 10 h -10 v 10 h -10 v -10 h -10 z" fill="#ff007a" />
      <!-- Action Buttons -->
      <circle cx="85" cy="25" r="5" fill="#ffe259" />
      <circle cx="100" cy="40" r="5" fill="#00f2fe" />
      <circle cx="85" cy="55" r="5" fill="#27c93f" />
      <circle cx="70" cy="40" r="5" fill="#ff007a" />
    </g>
  </g>
  
  <!-- Additional Foreground Floating Accent -->
  <g transform="translate(350, 270)">
    <g class="fly-item-1">
      <polygon points="0,-15 15,10 -15,10" fill="none" stroke="#ffe259" stroke-width="3" filter="url(#glowYellow)" />
    </g>
  </g>

</svg>
