<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="50%" stop-color="#080b12"/>
      <stop offset="100%" stop-color="#050509"/>
    </linearGradient>

    <radialGradient id="blueGlow" cx="15%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#3155ff" stop-opacity="0.28"/>
      <stop offset="35%" stop-color="#3928a8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      
      <animate
        attributeName="cx"
        values="15%;30%;15%"
        dur="14s"
        repeatCount="indefinite"/>

      <animate
        attributeName="cy"
        values="20%;70%;20%"
        dur="14s"
        repeatCount="indefinite"/>
    </radialGradient>

    <radialGradient id="purpleGlow" cx="90%" cy="80%" r="75%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.20"/>
      <stop offset="40%" stop-color="#4c1d95" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      
      <animate
        attributeName="cx"
        values="90%;70%;90%"
        dur="17s"
        repeatCount="indefinite"/>

      <animate
        attributeName="cy"
        values="80%;25%;80%"
        dur="17s"
        repeatCount="indefinite"/>
    </radialGradient>

    <radialGradient id="redGlow" cx="100%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#ff3b3b" stop-opacity="0.10"/>
      <stop offset="45%" stop-color="#8b1e1e" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path
        d="M 32 0 L 0 0 0 32"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.035"
        stroke-width="1"/>
    </pattern>

    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#dfe6ff"/>
      <stop offset="70%" stop-color="#aabaff"/>
      <stop offset="100%" stop-color="#ffffff"/>
      
      <animate
        attributeName="x1"
        values="0%;100%;0%"
        dur="6s"
        repeatCount="indefinite"/>
      
      <animate
        attributeName="x2"
        values="100%;200%;100%"
        dur="6s"
        repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="scanline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>

      <animate
        attributeName="x1"
        values="-100%;100%"
        dur="5s"
        repeatCount="indefinite"/>

      <animate
        attributeName="x2"
        values="0%;200%"
        dur="5s"
        repeatCount="indefinite"/>
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <filter id="textGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="rounded">
      <rect x="0" y="0" width="800" height="200" rx="12"/>
    </clipPath>

  </defs>

  <rect
    width="800"
    height="200"
    rx="12"
    fill="url(#background)"/>

  <g clip-path="url(#rounded)">

    <rect
      width="800"
      height="200"
      fill="url(#grid)"/>

    <rect
      width="800"
      height="200"
      fill="url(#blueGlow)"/>

    <rect
      width="800"
      height="200"
      fill="url(#purpleGlow)"/>

    <rect
      width="800"
      height="200"
      fill="url(#redGlow)"/>

    <g
      fill="none"
      stroke="#6677ff"
      stroke-opacity="0.14"
      stroke-width="1">

      <path d="M0 145 H90 V120 H140"/>
      <path d="M800 45 H715 V70 H675"/>
      <path d="M60 0 V35 H110"/>
      <path d="M740 200 V160 H690"/>

    </g>



    <g fill="#7c83ff">

      <circle cx="90" cy="145" r="2">
        <animate
          attributeName="opacity"
          values="0.2;0.8;0.2"
          dur="2s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="715" cy="45" r="2">
        <animate
          attributeName="opacity"
          values="0.8;0.2;0.8"
          dur="2.7s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="110" cy="35" r="2">
        <animate
          attributeName="opacity"
          values="0.2;0.7;0.2"
          dur="3s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="690" cy="160" r="2">
        <animate
          attributeName="opacity"
          values="0.7;0.2;0.7"
          dur="2.4s"
          repeatCount="indefinite"/>
      </circle>

    </g>

    <g
      opacity="0.10"
      transform="translate(620 105)">

      <path
        d="M-100 55 L-70 25 L-45 42 L-15 5 L20 35 L48 12 L90 55 Z"
        fill="#6677ff"/>

      <line
        x1="-110"
        y1="55"
        x2="110"
        y2="55"
        stroke="#9da7ff"
        stroke-width="1"/>

      <circle
        cx="55"
        cy="-10"
        r="22"
        fill="none"
        stroke="#8b5cf6"
        stroke-width="1"/>

      <rect x="-85" y="40" width="5" height="5" fill="#8b5cf6"/>
      <rect x="-25" y="25" width="4" height="4" fill="#6677ff"/>
      <rect x="35" y="38" width="6" height="6" fill="#8b5cf6"/>

    </g>

    <rect
      x="0"
      y="0"
      width="800"
      height="200"
      fill="url(#scanline)"
      opacity="0.25"/>

    <g id="terminal">

      <text
        x="35"
        y="48"
        font-family="monospace"
        font-size="13"
        fill="#6974a8">

        sakti@github:~$

        <tspan fill="#ffffff">
          whoami
        </tspan>

      </text>

      <text
        x="35"
        y="75"
        font-family="monospace"
        font-size="15"
        font-weight="bold"
        fill="#7c83ff"
        opacity="0">

        Initializing developer profile...

        <animate
          attributeName="opacity"
          values="0;1"
          begin="0.4s"
          dur="0.4s"
          fill="freeze"/>

      </text>

      <rect
        x="35"
        y="94"
        width="300"
        height="5"
        rx="2"
        fill="#222637"/>

      <rect
        x="35"
        y="94"
        width="0"
        height="5"
        rx="2"
        fill="#6677ff">

        <animate
          attributeName="width"
          values="0;300"
          dur="2.2s"
          fill="freeze"/>

      </rect>


      <text
        x="35"
        y="125"
        font-family="monospace"
        font-size="11"
        fill="#59627f"
        opacity="0">

        Loading systems...
        
        <animate
          attributeName="opacity"
          values="0;1"
          begin="0.8s"
          dur="0.3s"
          fill="freeze"/>

      </text>


      <text
        x="35"
        y="145"
        font-family="monospace"
        font-size="11"
        fill="#59627f"
        opacity="0">

        Loading game worlds...

        <animate
          attributeName="opacity"
          values="0;1"
          begin="1.3s"
          dur="0.3s"
          fill="freeze"/>

      </text>


      <text
        x="35"
        y="165"
        font-family="monospace"
        font-size="11"
        fill="#59627f"
        opacity="0">

        Loading experiences...

        <animate
          attributeName="opacity"
          values="0;1"
          begin="1.8s"
          dur="0.3s"
          fill="freeze"/>

      </text>


      <!-- Fade terminal -->

      <animate
        attributeName="opacity"
        values="1;0"
        begin="2.7s"
        dur="0.5s"
        fill="freeze"/>

    </g>




    <g
      id="profile"
      opacity="0">


      <text
        x="400"
        y="55"
        text-anchor="middle"
        font-family="monospace"
        font-size="11"
        letter-spacing="4"
        fill="#737da8">

        DEVELOPER PROFILE

      </text>

      <text
        x="400"
        y="94"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="30"
        font-weight="700"
        letter-spacing="1"
        fill="url(#nameGradient)"
        filter="url(#textGlow)">

        SAKTI ARIF DWI PUTRA

      </text>

      <rect
        x="270"
        y="108"
        width="260"
        height="1"
        fill="#6677ff"
        opacity="0.5">

        <animate
          attributeName="width"
          values="0;260"
          dur="1s"
          begin="3.4s"
          fill="freeze"/>

        <animate
          attributeName="x"
          values="400;270"
          dur="1s"
          begin="3.4s"
          fill="freeze"/>

      </rect>

      <text
        x="400"
        y="135"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16"
        font-weight="600"
        letter-spacing="2"
        fill="#8f9cff">

        FULL-STACK DEVELOPER
        <tspan fill="#555b78"> • </tspan>
        <tspan fill="#c3a6ff">GAME DEVELOPMENT</tspan>

      </text>

      <text
        x="400"
        y="162"
        text-anchor="middle"
        font-family="monospace"
        font-size="11"
        letter-spacing="1"
        fill="#69718f"
        opacity="0">

        FROM SYSTEMS AND LOGIC TO WORLDS AND EXPERIENCES

        <animate
          attributeName="opacity"
          values="0;1"
          begin="4.1s"
          dur="1s"
          fill="freeze"/>

      </text>

      <animate
        attributeName="opacity"
        values="0;1"
        begin="3.1s"
        dur="0.8s"
        fill="freeze"/>

    </g>

  </g>


  <rect
    x="1"
    y="1"
    width="798"
    height="198"
    rx="11"
    fill="none"
    stroke="#20263b"
    stroke-width="1"/>

  <rect
    x="2"
    y="2"
    width="796"
    height="196"
    rx="10"
    fill="none"
    stroke="#6677ff"
    stroke-opacity="0.08"
    stroke-width="1"/>

</svg>
