<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" width="440" height="400" role="img" aria-labelledby="t d">
  <title id="t">Game Development</title>
  <desc id="d">Gameplay programming, game systems, interactive mechanics, game logic, UI and UX for games, and creative game experiences.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0510"/>
      <stop offset="1" stop-color="#020810"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff007a"/>
      <stop offset="1" stop-color="#7928ca"/>
    </linearGradient>
    <style>
      .glow { animation: glow 5s ease-in-out -2.5s infinite; }
      .row { animation: rise 0.7s ease-out both; }
      .r2 { animation-delay: 0.08s; } .r3 { animation-delay: 0.16s; } .r4 { animation-delay: 0.24s; } .r5 { animation-delay: 0.32s; } .r6 { animation-delay: 0.4s; }
      @keyframes glow { 0%,100% { stroke-opacity: 0.35; } 50% { stroke-opacity: 0.9; } }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect x="2" y="2" width="436" height="396" rx="20" fill="url(#card)"/>
  <rect class="glow" x="2" y="2" width="436" height="396" rx="20" fill="none" stroke="#ff007a" stroke-width="1.5"/>
  <rect x="2" y="2" width="436" height="6" rx="3" fill="url(#accent)"/>

  <!-- Icon: game controller -->
  <g transform="translate(28 34)">
    <rect width="52" height="52" rx="14" fill="#ff007a" fill-opacity="0.12" stroke="#ff007a" stroke-opacity="0.65"/>
    <rect x="9" y="17" width="34" height="20" rx="10" fill="none" stroke="#ff007a" stroke-width="1.8"/>
    <path d="M18 23 v8 M14 27 h8" stroke="#ff8cc0" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="33" cy="25" r="2" fill="#ff8cc0"/>
    <circle cx="37" cy="29" r="2" fill="#00f2fe"/>
  </g>
  <g font-family="'Segoe UI', Inter, system-ui, -apple-system, Arial, sans-serif">
    <text x="96" y="58" font-size="18" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">GAME DEVELOPMENT</text>
    <text x="96" y="80" font-size="13" fill="#8b8b99">Systems, mechanics and play experiences</text>

    <g font-size="16" fill="#ffe0ee">
      <g class="row"><rect x="24" y="112" width="392" height="38" rx="10" fill="#ff007a" fill-opacity="0.08"/><path d="M44 131 l5 -5 l5 5 l-5 5 z" fill="#ff007a"/><text x="68" y="137">Gameplay Programming</text></g>
      <g class="row r2"><rect x="24" y="156" width="392" height="38" rx="10" fill="#ff007a" fill-opacity="0.08"/><path d="M44 175 l5 -5 l5 5 l-5 5 z" fill="#ff007a"/><text x="68" y="181">Game Systems</text></g>
      <g class="row r3"><rect x="24" y="200" width="392" height="38" rx="10" fill="#ff007a" fill-opacity="0.08"/><path d="M44 219 l5 -5 l5 5 l-5 5 z" fill="#7928ca"/><text x="68" y="225">Interactive Mechanics</text></g>
      <g class="row r4"><rect x="24" y="244" width="392" height="38" rx="10" fill="#ff007a" fill-opacity="0.08"/><path d="M44 263 l5 -5 l5 5 l-5 5 z" fill="#7928ca"/><text x="68" y="269">Game Logic</text></g>
      <g class="row r5"><rect x="24" y="288" width="392" height="38" rx="10" fill="#ff007a" fill-opacity="0.08"/><path d="M44 307 l5 -5 l5 5 l-5 5 z" fill="#ff007a"/><text x="68" y="313">UI/UX for Games</text></g>
      <g class="row r6"><rect x="24" y="332" width="392" height="38" rx="10" fill="#ff007a" fill-opacity="0.08"/><path d="M44 351 l5 -5 l5 5 l-5 5 z" fill="#ff007a"/><text x="68" y="357">Creative Game Experiences</text></g>
    </g>
  </g>
</svg>

