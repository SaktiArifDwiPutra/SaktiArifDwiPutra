<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 108" width="880" height="108" role="img" aria-labelledby="t d">
  <title id="t">CritiPlay</title>
  <desc id="d">Full-Stack Game Discovery, Backlog Tracker and Review Platform</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090e"/>
      <stop offset="0.65" stop-color="#09090e"/>
      <stop offset="1" stop-color="#0a0510"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f2fe"/>
      <stop offset="0.55" stop-color="#4facfe"/>
      <stop offset="1" stop-color="#7928ca"/>
    </linearGradient>
    <clipPath id="c"><rect x="1" y="1" width="878" height="106" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect x="1" y="1" width="878" height="106" rx="14" fill="url(#bg)"/>
    <rect x="1" y="1" width="878" height="4" fill="url(#bar)"/>
    <!-- Icon -->
    <g transform="translate(24 28)">
      <rect width="54" height="54" rx="12" fill="#121218" stroke="#00f2fe" stroke-opacity="0.45" stroke-width="1.2"/>
      <rect x="12" y="17" width="30" height="20" rx="8" fill="none" stroke="#00f2fe" stroke-width="1.8"/>
      <path d="M20 24 v6 M17 27 h6" stroke="#9fefff" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="32.5" cy="25.5" r="1.8" fill="#ffe259"/>
      <circle cx="36" cy="29" r="1.8" fill="#ff007a"/>
    </g>
    <!-- Title & Subtitle -->
    <g font-family="'Segoe UI', Inter, system-ui, -apple-system, Arial, sans-serif">
      <text x="96" y="48" font-size="24" font-weight="800" fill="#f4f4f5">CritiPlay</text>
      <text x="96" y="73" font-size="14" fill="#a1a1aa">Game Discovery, Backlog Tracker &amp; Review Platform</text>
    </g>
    <!-- Right Pills -->
    <g font-family="'Segoe UI', Inter, system-ui, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">
      <rect x="650" y="39" width="102" height="28" rx="8" fill="#121218" stroke="#00f2fe" stroke-opacity="0.5"/>
      <text x="701" y="57" text-anchor="middle" fill="#00f2fe">FULL-STACK</text>
      <rect x="762" y="39" width="94" height="28" rx="8" fill="#121218" stroke="#7928ca" stroke-opacity="0.6"/>
      <text x="809" y="57" text-anchor="middle" fill="#ff8cc0">FLAGSHIP</text>
    </g>
  </g>
  <rect x="1" y="1" width="878" height="106" rx="14" fill="none" stroke="#27272a" stroke-width="1.2"/>
