<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 400" width="460" height="400" role="img" aria-labelledby="t d">
  <title id="t">Full-Stack Development</title>
  <desc id="d">Frontend Development, Backend Development, REST API Development, Database Management, Application Architecture, and Responsive Web Applications.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090e"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f2fe"/>
      <stop offset="1" stop-color="#4facfe"/>
    </linearGradient>
    <style>
      .glow { animation: glowPulse 5s ease-in-out infinite; }
      @keyframes glowPulse { 0%,100% { stroke-opacity: 0.35; } 50% { stroke-opacity: 0.85; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect x="2" y="2" width="456" height="396" rx="20" fill="url(#card)"/>
  <rect class="glow" x="2" y="2" width="456" height="396" rx="20" fill="none" stroke="#00f2fe" stroke-width="1.5"/>
  <rect x="2" y="2" width="456" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- Icon: browser window with code brackets -->
  <g transform="translate(28 32)">
    <rect width="52" height="52" rx="14" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-opacity="0.6"/>
    <rect x="11" y="13" width="30" height="26" rx="4" fill="none" stroke="#00f2fe" stroke-width="1.8"/>
    <path d="M11 20 H41" stroke="#00f2fe" stroke-width="1.8"/>
    <path d="M22 26 L18 30 L22 34 M30 26 L34 30 L30 34" fill="none" stroke="#9fefff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="'Segoe UI', Inter, system-ui, -apple-system, Arial, sans-serif">
    <text x="96" y="56" font-size="18" font-weight="700" letter-spacing="1.4" fill="#f4f4f5">FULL-STACK DEVELOPMENT</text>
    <text x="96" y="78" font-size="13" fill="#a1a1aa">Interfaces, APIs, and data end to end</text>

    <g font-size="15.5" fill="#d4d4d8">
      <g><rect x="24" y="110" width="412" height="38" rx="10" fill="#121218" fill-opacity="0.72" stroke="#00f2fe" stroke-opacity="0.16"/><path d="M44 129 l5 -5 l5 5 l-5 5 z" fill="#00f2fe"/><text x="68" y="135">Frontend Development</text></g>
      <g><rect x="24" y="154" width="412" height="38" rx="10" fill="#121218" fill-opacity="0.72" stroke="#00f2fe" stroke-opacity="0.16"/><path d="M44 173 l5 -5 l5 5 l-5 5 z" fill="#00f2fe"/><text x="68" y="179">Backend Development</text></g>
      <g><rect x="24" y="198" width="412" height="38" rx="10" fill="#121218" fill-opacity="0.72" stroke="#4facfe" stroke-opacity="0.2"/><path d="M44 217 l5 -5 l5 5 l-5 5 z" fill="#4facfe"/><text x="68" y="223">REST API Development</text></g>
      <g><rect x="24" y="242" width="412" height="38" rx="10" fill="#121218" fill-opacity="0.72" stroke="#4facfe" stroke-opacity="0.2"/><path d="M44 261 l5 -5 l5 5 l-5 5 z" fill="#4facfe"/><text x="68" y="267">Database Management</text></g>
      <g><rect x="24" y="286" width="412" height="38" rx="10" fill="#121218" fill-opacity="0.72" stroke="#00f2fe" stroke-opacity="0.16"/><path d="M44 305 l5 -5 l5 5 l-5 5 z" fill="#00f2fe"/><text x="68" y="311">Application Architecture</text></g>
      <g><rect x="24" y="330" width="412" height="38" rx="10" fill="#121218" fill-opacity="0.72" stroke="#00f2fe" stroke-opacity="0.16"/><path d="M44 349 l5 -5 l5 5 l-5 5 z" fill="#00f2fe"/><text x="68" y="355">Responsive Web Applications</text></g>
    </g>
  </g>
</svg>
