<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" width="440" height="400" role="img" aria-labelledby="t d">
  <title id="t">Full-Stack Development</title>
  <desc id="d">Frontend, backend, REST API, database, responsive web applications and application architecture.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090e"/>
      <stop offset="1" stop-color="#020810"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f2fe"/>
      <stop offset="1" stop-color="#4facfe"/>
    </linearGradient>
    <style>
      .glow { animation: glow 5s ease-in-out infinite; }
      .row { animation: rise 0.7s ease-out both; }
      .r2 { animation-delay: 0.08s; } .r3 { animation-delay: 0.16s; } .r4 { animation-delay: 0.24s; } .r5 { animation-delay: 0.32s; } .r6 { animation-delay: 0.4s; }
      @keyframes glow { 0%,100% { stroke-opacity: 0.35; } 50% { stroke-opacity: 0.9; } }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect x="2" y="2" width="436" height="396" rx="20" fill="url(#card)"/>
  <rect class="glow" x="2" y="2" width="436" height="396" rx="20" fill="none" stroke="#00f2fe" stroke-width="1.5"/>
  <rect x="2" y="2" width="436" height="6" rx="3" fill="url(#accent)"/>

  <!-- Icon: browser window with code brackets -->
  <g transform="translate(28 34)">
    <rect width="52" height="52" rx="14" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-opacity="0.6"/>
    <rect x="11" y="13" width="30" height="26" rx="4" fill="none" stroke="#00f2fe" stroke-width="1.8"/>
    <path d="M11 20 H41" stroke="#00f2fe" stroke-width="1.8"/>
    <path d="M22 26 L18 30 L22 34 M30 26 L34 30 L30 34" fill="none" stroke="#a5f9ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="'Segoe UI', Inter, system-ui, -apple-system, Arial, sans-serif">
    <text x="96" y="58" font-size="18" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">FULL-STACK DEVELOPMENT</text>
    <text x="96" y="80" font-size="13" fill="#71717a">Interfaces, APIs and data, end to end</text>

    <g font-size="16" fill="#d4d4d8">
      <g class="row"><rect x="24" y="112" width="392" height="38" rx="10" fill="#00f2fe" fill-opacity="0.06"/><path d="M44 131 l5 -5 l5 5 l-5 5 z" fill="#00f2fe"/><text x="68" y="137">Frontend Development</text></g>
      <g class="row r2"><rect x="24" y="156" width="392" height="38" rx="10" fill="#00f2fe" fill-opacity="0.06"/><path d="M44 175 l5 -5 l5 5 l-5 5 z" fill="#00f2fe"/><text x="68" y="181">Backend Development</text></g>
      <g class="row r3"><rect x="24" y="200" width="392" height="38" rx="10" fill="#00f2fe" fill-opacity="0.06"/><path d="M44 219 l5 -5 l5 5 l-5 5 z" fill="#4facfe"/><text x="68" y="225">REST API Development</text></g>
      <g class="row r4"><rect x="24" y="244" width="392" height="38" rx="10" fill="#00f2fe" fill-opacity="0.06"/><path d="M44 263 l5 -5 l5 5 l-5 5 z" fill="#4facfe"/><text x="68" y="269">Database Management</text></g>
      <g class="row r5"><rect x="24" y="288" width="392" height="38" rx="10" fill="#00f2fe" fill-opacity="0.06"/><path d="M44 307 l5 -5 l5 5 l-5 5 z" fill="#00f2fe"/><text x="68" y="313">Responsive Web Applications</text></g>
      <g class="row r6"><rect x="24" y="332" width="392" height="38" rx="10" fill="#00f2fe" fill-opacity="0.06"/><path d="M44 351 l5 -5 l5 5 l-5 5 z" fill="#00f2fe"/><text x="68" y="357">Application Architecture</text></g>
    </g>
  </g>
</svg>

